name: CI & Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check-and-deploy:
    name: Static Analysis & Cloud Run Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.15
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set up Biome
        uses: biomejs/setup-biome@v2

      - name: Set up actionlint, hadolint, and gitleaks
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin actionlint
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run static analysis & tests
        run: ./deploy/check.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HEAR_AUTH_TOKEN: ${{ secrets.HEAR_AUTH_TOKEN }}
        run: ./deploy/deploy.sh --skip-checks
